<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.15);
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
  }
  #selection {
    position: fixed;
    border: 2px solid #007AFF;
    background: rgba(0, 122, 255, 0.08);
    display: none;
    pointer-events: none;
    z-index: 10;
  }
  #dims {
    position: fixed;
    padding: 4px 8px;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    font: 12px -apple-system, sans-serif;
    border-radius: 4px;
    display: none;
    z-index: 20;
    pointer-events: none;
  }
  #hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 12px 20px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    font: 14px -apple-system, sans-serif;
    border-radius: 10px;
    z-index: 5;
    pointer-events: none;
    transition: opacity 0.2s;
  }
</style>
</head>
<body>
<div id="selection"></div>
<div id="dims"></div>
<div id="hint">Click and drag to select a region &middot; Esc to cancel</div>
<script>
const sel = document.getElementById('selection');
const dims = document.getElementById('dims');
const hint = document.getElementById('hint');
let startX = 0, startY = 0, dragging = false;

document.addEventListener('mousedown', (e) => {
  startX = e.clientX;
  startY = e.clientY;
  dragging = true;
  hint.style.opacity = '0';
  sel.style.display = 'block';
  sel.style.left = startX + 'px';
  sel.style.top = startY + 'px';
  sel.style.width = '0';
  sel.style.height = '0';
  dims.style.display = 'block';
});

document.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const x = Math.min(e.clientX, startX);
  const y = Math.min(e.clientY, startY);
  const w = Math.abs(e.clientX - startX);
  const h = Math.abs(e.clientY - startY);
  sel.style.left = x + 'px';
  sel.style.top = y + 'px';
  sel.style.width = w + 'px';
  sel.style.height = h + 'px';
  dims.textContent = w + ' × ' + h;
  dims.style.left = (x + w + 8) + 'px';
  dims.style.top = (y + h + 8) + 'px';
});

document.addEventListener('mouseup', (e) => {
  if (!dragging) return;
  dragging = false;
  const x = Math.min(e.clientX, startX);
  const y = Math.min(e.clientY, startY);
  const w = Math.abs(e.clientX - startX);
  const h = Math.abs(e.clientY - startY);

  if (w > 5 && h > 5) {
    // Scale for retina
    const scale = window.devicePixelRatio || 1;
    fetch('http://localhost:47932/api/capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'region',
        region: {
          x: Math.round(x * scale),
          y: Math.round(y * scale),
          width: Math.round(w * scale),
          height: Math.round(h * scale)
        }
      })
    }).then(() => {
      // Signal overlay to close
      document.title = '__REGION_DONE__';
    }).catch(() => {
      document.title = '__REGION_DONE__';
    });
  } else {
    document.title = '__REGION_CANCEL__';
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.title = '__REGION_CANCEL__';
  }
});
</script>
</body>
</html>
